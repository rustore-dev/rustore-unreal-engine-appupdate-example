plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace = "ru.rustore.unrealsdk.appupdate"

    compileSdkVersion = 34
    buildToolsVersion = "35.0.1"

    defaultConfig {
        minSdk = 24
        targetSdk = 34
        versionCode = sdk_version_code_appupdate
        versionName = "${rustore_appupdate_version}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "ru.rustore.sdk:appupdate:$rustore_appupdate_version"
    implementation project(path: ':RuStoreUnrealCore')
    compileOnly fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

def copyAARUnreal = tasks.register('copyAARUnreal', Copy) {
    from    ( layout.buildDirectory.dir("outputs/aar") )
    include ( "${project.name}-release.aar" )
    into    ( [rootDir.absolutePath, '..', 'unreal_example', 'Plugins', 'RuStoreAppUpdate', 'Source', 'RuStoreAppUpdate', 'ThirdParty', 'Android', 'libs' ].join(File.separator) )
    rename  ("${project.name}-release.aar", "${project.name}${rustore_sdk_type}.aar")
}

afterEvaluate {
    assembleRelease.finalizedBy('copyAARUnreal')
}
